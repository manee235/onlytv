<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/anka-sign.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>ANKA - Live Stream & IPTV Web Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      // High-End Security: Clean up any stale or rogue service workers intercepting API stream proxies
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
        if (window.caches) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          }).catch(function() {});
        }
      }
    </script>
  </head>
  <body style="background:#000000;margin:0;padding:0;overflow:hidden;">
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;z-index:9999;">
        <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:28px;">
          <img src="/anka-sign.png" alt="ANKA Sign" style="width:52px;height:52px;object-fit:contain;" />
          <img src="/logo.png" alt="ANKA TV" style="width:190px;max-width:60vw;height:auto;object-fit:contain;" />
        </div>
        <div style="width:230px;height:3px;background:rgba(255,255,255,0.18);border-radius:9999px;overflow:hidden;position:relative;">
          <div style="width:45%;height:100%;background:#ffffff;border-radius:9999px;animation:splashStrip 1.2s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes splashStrip {
          0% { transform: translateX(-100%); width: 25%; }
          50% { transform: translateX(110%); width: 55%; }
          100% { transform: translateX(350%); width: 25%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
